<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tomorrow's Movers</title>
<style>
:root{--bg:#f1f4f9;--cd:#fff;--fg:#162033;--mu:#66728a;--bd:#e0e6f0;--ac:#2563eb;--ac2:#e8effd;--up:#0d9c4a;--upb:#e3f6ea;--dn:#d4303a;--dnb:#fdeaec;--am:#b7791f;--amb:#fdf3dc;--sh:0 1px 4px rgba(20,32,60,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1118;--cd:#181d27;--fg:#e9edf5;--mu:#97a3ba;--bd:#2a3140;--ac:#6b9bff;--ac2:#1c2a4a;--up:#4cd07f;--upb:#12301f;--dn:#ff7d85;--dnb:#3a1a1e;--am:#f0b94d;--amb:#3a2d12;--sh:none}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:14px}h1{margin:0 0 2px;font-size:24px}h3{margin:18px 2px 8px;font-size:16px}
.mu{color:var(--mu)}.sm{font-size:12.5px}.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.i{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--ac);background:none;color:var(--ac);font:italic 700 13px Georgia,serif;cursor:pointer;padding:0}
.tip{background:var(--ac2);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:13.5px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.grid>.card{margin:0}
.tile{background:var(--bg);border-radius:12px;padding:10px;text-align:center}.big{font-size:28px;font-weight:700;line-height:1.1}.big2{font-size:18px;font-weight:700}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--ac2);margin-left:4px}
.pill.up{background:var(--upb)}.pill.dn{background:var(--dnb)}.pill.am{background:var(--amb)}.pill.lg{font-size:17px;padding:5px 14px;margin:0 0 6px}
.top{display:flex;align-items:center;gap:8px;cursor:pointer}.top>div:first-child{flex:1;min-width:0}.rt{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:3px 8px;font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.kv div{background:var(--bg);border-radius:10px;padding:8px;font-weight:600}.kv span{display:block;font-size:12px;font-weight:400;color:var(--mu)}
.det{margin-top:10px;border-top:1px dashed var(--bd);padding-top:8px}
.mini{background:var(--bg);border-radius:12px;padding:10px}.mt{display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;padding:9px 4px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--fg);font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}.tabs .on{background:var(--ac);border-color:var(--ac);color:#fff}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--fg);font:inherit}
.btn{width:100%;margin-top:10px;padding:11px;border:2px solid var(--ac);border-radius:10px;background:transparent;color:var(--ac);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}.btn:hover{background:var(--ac);color:#fff}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}.lc{width:min(400px,100%);padding:22px;text-align:center}.lg{width:100%;height:auto;margin:10px 0 14px}
.cd{transform-box:fill-box;transform-origin:50% 100%;opacity:.85;animation:pl 2.4s ease-in-out infinite}.cd.u{fill:var(--up)}.cd.d{fill:var(--dn)}
.ln{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:100;animation:dr 4.5s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}@keyframes dr{0%{stroke-dashoffset:100}65%,100%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.cd,.ln{animation:none;stroke-dashoffset:0}}
.foot{font-size:12px;color:var(--mu);margin:18px 2px}
</style></head><body>
<div id="login"><div class="lc card"><h1>Tomorrow's Movers</h1><div class="mu sm">Stocks likely to move a lot on the next trading day</div>
<svg class="lg" viewBox="0 0 320 110"><g id="bars"></g><polyline id="line" class="ln" pathLength="100"/></svg>
<input id="pw" type="password" placeholder="Enter password" autocomplete="current-password">
<label class="mu sm" style="display:block;margin-top:10px;text-align:left"><input type="checkbox" id="keep" style="width:auto;margin-right:6px">Keep me signed in on this device</label>
<button class="btn" onclick="unlock()">Open</button><p id="err" class="dn sm"></p><div class="mu sm" id="up"></div><div class="mu sm">Private dashboard. For learning only.</div></div></div>
<div id="main" class="w" hidden>
<div class="ch"><h1>Tomorrow's Movers</h1><div><span class="pill" id="dt"></span><button class="pill" onclick="lock()" style="border:1px solid var(--bd);color:var(--fg);cursor:pointer;font-family:inherit">Lock</button></div></div>
<div class="mu sm" id="upd" style="margin:-4px 0 4px"></div>
<div class="tabs"><button data-t="m" onclick="show('m')">Movers</button><button data-t="g" onclick="show('g')">Gap lookup</button><button data-t="h" onclick="show('h')">History</button><button data-t="k" onclick="show('k')">Market</button></div>
<div class="tab" id="t-m"></div><div class="tab" id="t-g"></div><div class="tab" id="t-h"></div><div class="tab" id="t-k"></div>
<p class="foot">For learning only. Not investment advice. Past statistics do not predict the future. The list shows stocks likely to move a lot, not which direction.</p></div>

h+=`<div class="card"><div class="top" onclick="tg('hd${i}')"><div><b>${fd(d.date)}</b><div class="mu sm">${k.length?'Top 10: '+k.filter(x=>Math.abs(x.cc)>=4).length+' closed 4%+ up or down, '+k.filter(x=>x.range_pct>=5).length+' had a 5%+ day range':'Result not available yet'}</div></div><span class="pill ${mc[d.mood]||''}">${d.mood}</span><button class="i" onclick="ti(event,this)">i</button></div><div class="tip" hidden>${T.day}</div><div class="det" id="hd${i}" hidden><div class="grid g2">${t10.map(res).join('')}</div>${rest.length?`<button class="btn" onclick="tg('hx${i}')">Show or hide the other 10</button><div class="grid g2" id="hx${i}" hidden style="margin-top:10px">${rest.map(res).join('')}</div>`:''}</div></div>`});
$('#t-h').innerHTML=h}
function mkt(){const B=S.breadth,m=S.market;if(!B.length){$('#t-k').innerHTML=card('Market','<p class="mu">No breadth data.</p>');return}
const W=360,H=210,L=40,R=12,Tp=12,Bt=26,n=B.length,m0=Math.max(...B.map(b=>Math.max(b.above,b.below))),st=m0>2500?1000:500,mx=Math.ceil(m0/st)*st;
const X=i=>L+i*(W-L-R)/(n-1),Y=v=>Tp+(H-Tp-Bt)*(1-v/mx),P=k=>B.map((b,i)=>X(i).toFixed(1)+','+Y(b[k]).toFixed(1)).join(' '),l=B[n-1],sd=s=>fd(s).slice(0,-5);
let g='';for(let v=0;v<=mx;v+=st)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--mu)">${ni(v)}</text>`;
[0,Math.floor(n/2),n-1].forEach((i,j)=>g+=`<text x="${X(i)}" y="${H-8}" text-anchor="${j==0?'start':j==2?'end':'middle'}" font-size="10" fill="var(--mu)">${sd(B[i].date)}</text>`);
const ua=l.above>=l.below,b5=B[Math.max(n-6,0)],hl='paint-order="stroke" stroke="var(--cd)" stroke-width="4"';
const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%">${g}<polyline points="${P('above')}" fill="none" stroke="#2f80ed" stroke-width="2" stroke-linejoin="round"/><polyline points="${P('below')}" fill="none" stroke="#e5484d" stroke-width="2" stroke-linejoin="round"/>
<circle cx="${X(n-1)}" cy="${Y(l.above)}" r="3.5" fill="#2f80ed"/><circle cx="${X(n-1)}" cy="${Y(l.below)}" r="3.5" fill="#e5484d"/>
<text x="${W-R-6}" y="${Y(l.above)+(ua?-8:15)}" text-anchor="end" font-size="11" font-weight="700" fill="#2f80ed" ${hl}>${ni(l.above)}</text><text x="${W-R-6}" y="${Y(l.below)+(ua?15:-8)}" text-anchor="end" font-size="11" font-weight="700" fill="#e5484d" ${hl}>${ni(l.below)}</text></svg>`;
$('#t-k').innerHTML=card('Market mood today',`<span class="pill lg ${mc[m.mood]}">${m.mood}</span><div class="mu sm">As of ${fd(l.date)}</div>`,T.mood)+
card('Stocks above and below their 20-day average',`${svg}<div class="chips"><span class="chip"><b style="color:#2f80ed">&#9679;</b> Above the average</span><span class="chip"><b style="color:#e5484d">&#9679;</b> Below the average</span><span class="chip">Last ${n} days</span></div>`,T.br)+
`<div class="grid g3">${card('Above',`<div class="big" style="color:#2f80ed">${ni(l.above)}</div><div class="mu sm">stocks</div>`)}${card('Below',`<div class="big" style="color:#e5484d">${ni(l.below)}</div><div class="mu sm">stocks</div>`)}${card('Share above',`<div class="big">${f(l.pct,0)}%</div>`,T.pct)}</div>`+
card('Is the market improving?',`<div class="big ${cl(l.pct-b5.pct)}">${f(b5.pct,0)}% to ${f(l.pct,0)}%</div><div class="mu sm">Share of stocks above their 20-day average: 5 trading days ago vs today (${sg(l.pct-b5.pct)} percentage points)</div>`,T.chg)}
(function(){const n=18;let b='',p=[];for(let i=0;i<n;i++){const h=16+(i*37)%48;b+=`<rect class="cd ${(i*7)%3?'u':'d'}" x="${10+i*17}" y="${104-h}" width="9" height="${h}" rx="2" style="animation-delay:${(i*.13).toFixed(2)}s"/>`;p.push((14+i*17)+','+(70-i*2.3-Math.sin(i*1.3)*13).toFixed(1))}
$('#bars').innerHTML=b;$('#line').setAttribute('points',p.join(' '))})();
$('#up').textContent=D.g?'Data in this file: '+D.g+'. Newest data is checked when you press Open (online version).':'';
try{const sp=sessionStorage.getItem('mv')||localStorage.getItem('mv');if(sp)unlock(sp)}catch(x){}
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
