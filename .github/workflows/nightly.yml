name: Nightly scan
on:
  schedule:
    - cron: "47 13 * * 1-5"   # 7:17 PM India time
    - cron: "47 14 * * 1-5"   # 8:17 PM
    - cron: "47 15 * * 1-5"   # 9:17 PM
    - cron: "47 16 * * 1-5"   # 10:17 PM
    - cron: "17 18 * * 1-5"   # 11:47 PM
    - cron: "47 23 * * 1-5"   # 5:17 AM next morning
  workflow_dispatch:           # lets you press "Run workflow" by hand
concurrency:
  group: nightly-scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/bhav
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-
      - name: First run only - build past results for the History tab
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: |
          if [ ! -d results/history ]; then python scanner.py --history 300 --backfill 40; fi
      - name: Run scanner
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: python scanner.py --history 300
      - name: Prepare website files
        run: |
          mkdir -p docs
          cp results/dashboard.html docs/index.html
          cp results/data.json docs/data.json
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results docs
          git commit -m "Nightly scan" || echo "nothing new to save"
          git push
