name: Nightly scan
on:
  schedule:
    - cron: "17 18 * * 1-5"
    - cron: "47 23 * * 1-5"
  workflow_dispatch:
concurrency:
  group: nightly-scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/bhav
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-
      - name: First run only - build past results for the History tab
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: |
          if [ ! -d results/history ]; then python scanner.py --history 300 --backfill 40; fi
      - name: Rebuild past lists with the new rules (once)
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: |
          if [ ! -f results/.rules_v2 ]; then python scanner.py --backfill 60 --history 300 && touch results/.rules_v2; fi
      - name: Run scanner
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: python scanner.py --history 300
      - name: Show the scorecard on the run page
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat results/evaluation.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare website files
        run: |
          mkdir -p docs
          cp results/dashboard.html docs/index.html
          cp results/data.json docs/data.json
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results docs
          git commit -m "Nightly scan" || echo "nothing new to save"
          git pull --rebase origin main
          git push
